  - kind: other
    value: "Cloud & 3rd-Party Services (First-Party Misconfigurations)"
    asset_type: cloud
    max_severity: critical
    bounty_table: grab_web
    eligible: true
    notes: "Strictly limited to security misconfigurations within Grab's direct administrative control."

  # ── Mobile Assets (Android / iOS) ────────────────────────────────
