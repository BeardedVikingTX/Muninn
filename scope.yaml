# ─────────────────────────────────────────────────────────────────────
# Muninn scope.yaml — Grab Bug Bounty Program
# ─────────────────────────────────────────────────────────────────────
# Source: HackerOne Grab Program (captured 2026-11-07)
# Authoritative scope page: https://hackerone.com/grab/policy_scopes
#
# Precedence (first match wins, top to bottom):
#   1. excluded_assets   — in scope but zero bounty (e.g. *.qms.grab.com)
#   2. out_of_scope      — not authorized to test at all
#   3. in_scope          — most specific match wins (host > url > wildcard > domain)
#   4. default           — DROP (unlisted = out of scope, per policy)
# ─────────────────────────────────────────────────────────────────────

program: "Grab"
platform: hackerone
handle: "grab"

# ── Timeline (average, from program metrics) ─────────────────────────
time_frames:
  first_response: "1h"
  triage: "4d 6h"
  bounty: "2w 1d"
  submission_to_bounty: "2w 5d"
  resolution: "1m"          # estimated

# ── Bounty tables (one per payout class) ─────────────────────────────
# Source: Grab policy Rewards section + public bounty distribution data
bounty_tables:
  grab_web:
    low:      [50, 500]
    medium:   [500, 2000]
    high:     [2000, 5000]
    critical: [5000, 10000]
  grab_mobile:
    low:      [75, 750]
    medium:   [750, 3000]
    high:     [3000, 7500]
    critical: [7500, 15000]

# ── In scope ─────────────────────────────────────────────────────────
# kind: url | host | domain | wildcard | wildcard_scheme | regex
#   url             exact full URL (scheme + host + path)
#   host            exact host only
#   domain          example.com AND *.example.com
#   wildcard        *.example.com (subdomains only, NOT apex)
#   wildcard_scheme https://*.example.com (subdomains, scheme-locked)
#   regex           explicit Python regex (escape hatch — use sparingly)
#
# max_severity: severity of any finding is CAPPED at this value on this asset
# eligible:     false = in scope but zero bounty
# bounty_table: which table above to score against
in_scope:
  # ── All Other Assets (Web / API) ──────────────────────────────────
  - kind: wildcard
    value: "*.grab.com"
    asset_type: wildcard
    max_severity: critical
    bounty_table: grab_web
    eligible: true
    notes: "Core Grab domain. Highest volume of resolved reports (315)."

  - kind: wildcard
    value: "*.grab.co"
    asset_type: wildcard
    max_severity: medium
    bounty_table: grab_web
    eligible: true
    notes: "Max severity capped at Medium per program policy."

  - kind: wildcard
    value: "*.grabtaxi.com"
    asset_type: wildcard
    max_severity: medium
    bounty_table: grab_web
    eligible: true
    notes: "Max severity capped at Medium. Exception: p.grabtaxi.com (below) is Critical."

  - kind: host
    value: "p.grabtaxi.com"
    asset_type: api
    max_severity: critical
    bounty_table: grab_web
    eligible: true
    notes: "API gateway proxy. Auth via X-mts-ssid header. Overrides the Medium cap on *.grabtaxi.com."

  - kind: host
    value: "xtramile.grabpay.com"
    asset_type: domain
    max_severity: critical
    bounty_table: grab_web
    eligible: true

  - kind: host
    value: "manage.grab.co"
    asset_type: domain
    max_severity: critical
    bounty_table: grab_web
    eligible: true

  - kind: host
    value: "gamma.grab.co"
    asset_type: domain
    max_severity: critical
    bounty_table: grab_web
    eligible: true

  - kind: host
    value: "gifts.grab.com"
    asset_type: domain
    max_severity: critical
    bounty_table: grab_web
    eligible: true

  - kind: wildcard
    value: "*.grabpay.com"
    asset_type: wildcard
    max_severity: critical
    bounty_table: grab_web
    eligible: true

  - kind: host
    value: "api.grabpay.com"
    asset_type: api
    max_severity: critical
    bounty_table: grab_web
    eligible: true
    notes: "GrabPay API gateway. RESTful over HTTPS. Auth via X-mts-ssid."

  - kind: wildcard
    value: "*.grab-sure.com"
    asset_type: wildcard
    max_severity: critical
    bounty_table: grab_web
    eligible: true

  - kind: wildcard
    value: "*.myteksi.com"
    asset_type: wildcard
    max_severity: critical
    bounty_table: grab_web
    eligible: true
    notes: "25 resolved reports."

  - kind: wildcard
    value: "*.myteksi.net"
    asset_type: wildcard
    max_severity: critical
    bounty_table: grab_web
    eligible: true
    notes: "116 resolved reports — high activity."

  - kind: wildcard
    value: "*.ovo.id"
    asset_type: wildcard
    max_severity: high
    bounty_table: grab_web
    eligible: true
    notes: "Max severity capped at High. Staging/UAT subdomains are out of scope."

  - kind: wildcard
    value: "*.ovofinansial.com"
    asset_type: wildcard
    max_severity: critical
    bounty_table: grab_web
    eligible: true
    notes: "Formerly *.taralite.com."

  - kind: host
    value: "hungrygowhere.com"
    asset_type: domain
    max_severity: high
    bounty_table: grab_web
