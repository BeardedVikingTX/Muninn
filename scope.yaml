# ── Rate limit (documented only — Muninn makes no requests) ──────────
rate_limit:
  max_rps: 10

notes: |
  Grab program-specific requirements:
  - All traffic MUST include a custom header identifying you:
      X-Bug-Bounty: HackerOne-<username>
      X-Bug-Bounty: Timestamp-<DD-MM-YYYY HH:MM>
  - Only test against accounts you own.
  - Newly acquired sites: 16-month blackout period (critical/high only accepted).
  - Recently disclosed 0-days: wait 2 months before reporting.
  - Duplicates are closed without bounty.
  - Final bounty decisions are at Grab's discretion.
  - Maximum bonus of $2,000 for exceptional quality reports.
