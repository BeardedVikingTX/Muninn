# Muninn scope.yaml — Box HackerOne bug bounty program
# Based on the program asset list and metrics supplied by the researcher.
# Snapshot: 2026-11-22. Recheck the live program policy before testing.
# Authorization: exact listed hosts only; default DENY.
# Mobile and desktop assets are informational and MUST NOT be treated as web hosts.

program: "Box"
platform: hackerone
handle: "box_private"
policy_url: "https://hackerone.com/box_private"
scope_snapshot: "2026-11-22"

time_frames:
  first_response: "1h"
  triage: "2d 3h"
  bounty: "3w 6d"
  submission_to_bounty: "4w 1d"
  resolution: "1mo 3w"

# No authoritative payout bands were supplied. Never treat averages as ranges.
bounty_tables:
  box_program:
    low: null
    medium: null
    high: null
    critical: null

# Exact host matches. No *.box.com wildcard and no parent-domain allowance.
in_scope:
  - kind: host
    value: "upload.box.com"
    asset_type: domain
    max_severity: critical
    bounty_table: box_program
    eligible: true
    notes: "File upload ingestion, processing, and storage entry points."
  - kind: host
    value: "notes.services.box.com"
    asset_type: domain
    max_severity: critical
    bounty_table: box_program
    eligible: true
    notes: "Box Notes collaboration and synchronization backend."
  - kind: host
    value: "m.box.com"
    asset_type: domain
    max_severity: critical
    bounty_table: box_program
    eligible: true
    notes: "Mobile web application."
  - kind: host
    value: "dl.boxcloud.com"
    asset_type: domain
    max_severity: critical
    bounty_table: box_program
    eligible: true
    notes: "Downloads, signed URLs, and content delivery."
  - kind: host
    value: "cloud.app.box.com"
    asset_type: domain
    max_severity: critical
    bounty_table: box_program
    eligible: true
    notes: "Cloud-rendered and embedded content experiences."
  - kind: host
    value: "app.box.com"
    asset_type: domain
    max_severity: critical
    bounty_table: box_program
    eligible: true
    notes: "Primary Box web application, user and admin functionality."
  - kind: host
    value: "api.box.com"
    asset_type: api
    max_severity: critical
    bounty_table: box_program
    eligible: true
    notes: "Core API for files, users, collaborations, sharing, governance, and AI."
  - kind: host
    value: "account.box.com"
    asset_type: domain
    max_severity: critical
    bounty_table: box_program
    eligible: true
    notes: "Authentication, OAuth, SSO, tokens, and sessions."

# These entries are explicitly prohibited. Wildcards are defense-in-depth:
# the supplied program lists the apex domains as prohibited; subdomains are
# not independently authorized by any positive rule.
out_of_scope:
  - kind: domain
    value: "sr-staging-1.com"
    reason: "Explicitly prohibited by the Box program; no testing."
  - kind: domain
    value: "signrequest.com"
    reason: "Explicitly prohibited by the Box program; no testing."

excluded_assets: []

# The provided excerpt did not enumerate vulnerability-class exclusions.
# Do not import Grab's ineligible findings into the Box program.
core_ineligible: []

# These are authorized program assets, but are NOT HTTP host scope entries.
# The generic web/Burp auditor must not attempt to scan app store URLs.
mobile_assets:
  - platform: ios
    id: "290853822"
    name: "Box Mobile App (iOS)"
    store_url: "https://apps.apple.com/us/app/box-the-power-of-content-ai/id290853822"
    max_severity: critical
    bounty_table: box_program
    eligible: true
  - platform: android
    id: "com.box.android"
    name: "Box Mobile App (Android)"
    store_url: "https://play.google.com/store/apps/details?id=com.box.android"
    max_severity: critical
    bounty_table: box_program
    eligible: true

# Desktop software is separately eligible, not a host or wildcard.
other_assets:
  - kind: other
    value: "Box Tools"
    asset_type: desktop
    max_severity: critical
    bounty_table: box_program
    eligible: true
    download_page: "https://www.box.com/resources/downloads"
    notes: "Desktop installer for opening and editing Box files."
  - kind: other
    value: "Box Drive"
    asset_type: desktop
    max_severity: critical
    bounty_table: box_program
    eligible: true
    download_page: "https://www.box.com/resources/downloads/drive"
    notes: "Box Drive desktop application."

# 90-day average bounty and share of resolved reports, as supplied.
# Not payout guarantees; ranges are unknown.
platform_metrics:
  web:
    - band: low
      range: null
      avg_bounty: 150
      share_pct: 14.34
    - band: medium
      range: null
      avg_bounty: 250
      share_pct: 41.51
    - band: high
      range: null
      avg_bounty: 2041
      share_pct: 35.09
    - band: critical
      range: null
      avg_bounty: 5000
      share_pct: 9.06

# No Box rate-limit allowance was supplied; do not inherit Grab's 10 RPS.
# Keep active traffic disabled until the full policy and local execution
# controls have been reviewed.
rate_limit:
  max_rps: null

notes: |
  Box HackerOne program; scope data provided by the researcher.
  Eight exact web/API hostnames are in scope. No wildcard authorization.
  Two domains are expressly prohibited: sr-staging-1.com and signrequest.com.
  iOS, Android, Box Tools, and Box Drive are separately eligible software assets.
  Every listed eligible asset has a maximum severity of Critical.
  Program Signal requirement: 1.0+ past-year Signal, with trial reports for
  researchers below the threshold (per supplied program excerpt).
  Review the current HackerOne policy for permitted testing techniques,
  account requirements, rate limits, exclusions, and any scope changes.
  Default deny all unlisted hosts, redirects, and third-party destinations.
