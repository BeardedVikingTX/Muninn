# ── Out of scope (not authorized) ────────────────────────────────────
out_of_scope:
  # ── Staging / Development / UAT ──────────────────────────────────
  - kind: wildcard
    value: "*.byte-stack.net"
    reason: "Staging/Development/UAT — explicitly out of scope."
  - kind: wildcard
    value: "*.dududev"
    reason: "Staging/Development/UAT — explicitly out of scope."
  - kind: wildcard
    value: "*.uat-ovo.net"
    reason: "Staging/Development/UAT — explicitly out of scope."
  - kind: wildcard
    value: "*.qms.grab.com"
    reason: "Explicitly ineligible per program. Bounty: None."

  # ── Policy-based exclusions (vulnerability classes) ──────────────
  # These are enforced via core_ineligible below.

# ── Excluded assets (in scope technically, but ineligible) ───────────
# Different from out_of_scope: these are listed in the program, but have
# bounty = None / Ineligible. Findings here are reported separately with $0.
excluded_assets: []

# ── Core ineligible findings (silently dropped, never reported) ──────
# Source: Grab policy "Out-of-Scope Vulnerabilities" section (lines 113–145)
core_ineligible:
  # ── Information disclosure ──────────────────────────────────────
  - descriptive-error-messages
  - stack-traces
  - third-party-api-keys-no-impact
  - known-public-files
  - robots-txt-disclosure
  - private-ip-disclosure
  - version-disclosure

  # ── Low-impact / best-practice ──────────────────────────────────
  - open-redirect-no-impact          # only report if chained with sensitive impact
  - out-of-date-software-no-impact
  - host-header-misconfiguration-no-impact
  - broken-link-hijacking-no-impact
  - clickjacking-no-poc
  - tapjacking-no-poc
  - csv-injection-no-impact
  - mitm-required
  - physical-access-required
  - csrf-no-impact
  - cookie-flags-non-sensitive
  - http-options-method
  - content-spoofing
  - text-injection
  - outdated-browser-only
  - best-practice-no-exploit
  - reverse-tabnabbing
  - missing-security-headers
  - missing-csp
  - missing-hsts
  - weak-tls-ssl
  - mail-server-misconfiguration
  - spf-dmarc-misconfiguration
  - server-misconfiguration
  - sandbox-uat-staging-vulns
  - third-party-app-required
  - phishing-prerequisite
  - brute-force
  - denial-of-service
  - spamming
  - insufficient-rate-limiting

  # ── Mobile-specific ──────────────────────────────────────────────
  - uri-leak-malicious-app
  - absence-certificate-pinning
  - sensitive-data-in-urls-under-tls
  - unencrypted-external-storage
  - lack-of-obfuscation
  - malformed-intent-crashes

